        Selon la valeur indiquée dans les paramètres "__r__" et "__version__", ce service permet de retourner 3 types d'informations autour d'une limite :
        * r = versions : liste des version d'une limite (C8)
        * version = x ou last : détail d'une version x ou de la dernière version de la limite (C9)
        * r = limites : sommets rattachés à la limite (C10)
