        '403':
          description: |
            __403-12__ - Serveur d'authentification inaccessible<br>
            __403-13__ - Login ou mot de passe incorrect<br>
            __403-14__ - Renseigner la clé logiciel dans le User-Agent de la requête.
              Explication : une clé logiciel est nécessaire pour ce service.
