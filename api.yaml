            application/xml:
              schema:
                type: object
        '400':
          description: |
            __400-3__ - Le nom de la zone doit etre indiqué dans les paramètres (ex : zone=metropole) et doit prendre une des valeurs suivantes : metropole, antilles, guyane, reunion ou mayotte
        '403':
