              * 1 : Expirée
              * 2 : Terminée
              * 3 : Annulée par un signataire
              * 4 : Echec technique
              * 5 : Document d\'identité en attente de validation
              * A : Archivée
              * Z : Annulée en fin de collecte par le GE
              * R : Reprogrammée plus tard
        sign_order:
          type: string
          description:  |
            caractere parmi: 'S', 'O', (defaut='O')
              * O : ordonné
              * S : simultané
        convocation_email_content:
          type: string
          description: Texte de l’email de demande de signature, facultatif
        reminder_email_content:
          type: string
          description: Texte de l’email de rappel, facultatif
        automatic_notifiation:
          type: boolean
          description: Notifications automatiques au GE (defaut = 'True')
        display_date_on_seal:
          type: boolean
          description: Afficher la date sur la signature (default='True')
        send_doc_to_ge_upon_finished:
          type: boolean
          description: Envoyer les doc au GE à la fin de la collecte (default='True')
        get_sign_notifications:
          type: boolean
          description: Recevoir des notifications pour chaque signature (default='True')
        use_hand_signature:
          type: boolean
          description: Utiliser la signature manuscrite (default='True')
