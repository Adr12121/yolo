  /signatures/collections/new:
    post:
      tags:
        - signature
      description:  |
        Ce service permet de créer une nouvelle collecte de signature.
        Pour plus d'information sur le fonctionnement général de l'application Signature, vous pouvez consulter le <a href="https://www.geofoncier.fr/ressources/doc_pdf/guide_application_signatures_electroniques.pdf" target='blank'>guide utilisateur</a>.

        Vous devez être authentifié en tant que géomètre-expert pour utiliser les services de la composante SIGNATURE. L'authentification doit être réalisé via un token (bearerAuth). L'obtention d'un token se fait via un service dédié documenté ici : <a href="https://api2.preprod.geofoncier.fr/token.html" target="blank">obtenir un token</a>

        Pour créer une nouvelle collecte, vous devez fournir les informations suivantes :
         - __le fichier PDF à signer__, à uploader via le paramètre __file__
         - __la référence du dossier__ associé à ce document (enr_ref_dossier) : il s'agit du libellé du dossier tel qu'il est défini par le géomètre-expert
         - __le mode de facturation__ associé à la collecte (billing_mode) : il s'agit du mode de facturation (Forfaitaire ou Unitaire) tel qu'il est défini par le géomètre-expert (voir le <a href="https://www.geofoncier.fr/ressources/doc_pdf/tarifs_signature_electronique.pdf" target="blank">détails des tarifs</a>)
         - __si c'est un PV de bornage__ (is_pv_bornage) : true ou false, déclaratif par le GE. Dans le cas d'un choix de mode de facturation unitaire de la collecte, la signature d'un PV de bornage est facturé différement d'un autre document (voir le <a href="https://www.geofoncier.fr/ressources/doc_pdf/tarifs_signature_electronique.pdf" target="blank">détails des tarifs</a>)
         - __si c'est un DA__ (is_da) : true ou false, déclaratif par le GE.
         - __le type de document à signer__ (doc_code) : code du type de document envoyé à la signature. Cette information sert à bien qualifier le document signé lorsqu'il est automatiquement ajouté au dossier en fin de collecte. Valeur par défaut : '9DIz' (Autre document). La liste des codes documents peut être obtenues via le service /api/dossiersoge/codesdocuments (API Dossiers), seuls les documents avec doc_signable_electroniquement = true devraient être utilisés. Si la collecte comprend plusieurs documents (possible depuis le portail si is_da = true), c'est le code du premier document de la collecte qui est retourné.
         - __l'identifiant interne du dossier__ (enr_api_dossier) : il s'agit de l'identifiant sur 32 caractères interne à Géofoncier. Il peut être obtenu via les services l'API Dossiers, nottament le B5 qui pmermet de rechercher un dossier à partir de sa référence. Cette information est facultative mais importante car c'est elle qui permettra une fois le document signé, de le rattacher automatiquement au bon dossier dans Géofoncier.
         - la __durée__ de la collecte (total_duration) : en jours, par défaut à 25
         - la __fréquence de rappel__ (reminders) : en jours, permet d'indiquer à quelle fréquence les signataires seront relancés
         - la __liste des signataires__ (signatories) : pour chaque signataires, il faut indiquer son prénom, nom, adresse email et téléphone. Ces informations sont obligatoires. On peut également ajouter une référence parcellaire si on en dispose.
         - le __texte du mail initial__ envoyé aux signataires (convocation_email_content) : l'application propose par défaut un modèle de mail, mais celui-ci peut être remplacé par un autre texte en conservant les variables telles qu'indiquées dans le texte par défaut (voir exemple ci-dessous).
         - le __texte du mail de rappel__ envoyé aux signataires qui n'ont pas encore signé (reminder_email_content) : idem champ précédent.
         - 5 autres valeurs facultatives de type booléen permettant de personnaliser la configuration par défaut de la collecte :
            * __automatic_notification__ : si à true (valeur par défaut), le document signé sera automatiquement envoyé par email aux signataires à la fin de la collecte
            * __display_date_on_seal__ : si à true (valeur par défaut), la date sera affichée avec chaque signature
            * __send_doc_to_ge_upon_finished__ : si à true (valeur par défaut), le géomètre-expert recevra le document signé à la fin de la collecte
            * __get_sign_notifications__ : si à true (valeur par défaut), le géomètre-expert sera notifié après chaque signature
            * __use_hand_signature__ : par défaut à false, permet d'autoriser la fonction de signature manuscrite.

        Ces informations doivent être envoyées au format JSON dans le data du POST.
        Un exemple est fourni dans le test du service (bouton __[ Try it out ]__)

        Ce service fonctionne en POST (multipart/form-data) : les données sont envoyées dans le 'data' et le fichier dans le 'file'
      summary: F1 - Création d'une collecte
      parameters:
        - name: token_api
          in: query
          required: true
          description: Jeton applicatif valide
          schema:
            default: "166c5ffb-dc40-4bab-aaff-66a34ea70ca2"
            items:
              type: string
      requestBody:
        description: Informations pour la création de la collecte
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                # 'file' will be the field name in this multipart request
                file:
                  type: string
                  format: binary
                data:
                  type: object
                  example: |
                    { 
                    "enr_ref_dossier": "12345",
                    "enr_api_dossier": "5ba94bc29d138a1e0e051f882e72b2ab",
                    "billing_mode": "f",
                    "doc_code": "6CAc",
                    "is_da": false,
                    "is_pv_bornage": false,
                    "total_duration": 25,
                    "reminders": 25,
                    "signatories":[{
                      "first_name": "OBLIGATOIRE",
                      "last_name": "OBLIGATOIRE",
                      "email": "OBLIGATOIRE",
                      "mobile": "OBLIGATOIRE",
                      "cadastral_references": "optionnel"
                    }],
                    "convocation_email_content": "Bonjour {{ nom }},\nSuite à l'intervention du géomètres-expert concernant votre parcelle {{ cad }}, le PV de bornage est à signer à cette adresse : {{ url }}.\n Merci de réaliser cette opération rapidement. ",
                    "reminder_email_content": "Mail de rappel.",
                    "automatic_notification": true,
                    "display_date_on_seal": false,
                    "send_doc_to_ge_upon_finished": true,
                    "get_sign_notifications": true,
                    "use_hand_signature": false }
                  properties:
                    collecte:
                      $ref: '#/components/schemas/CollecteCreation'
      responses:
        '201':
          description: Collecte créée
        '403':
          description: |
            ERREUR 1 - Vous n'êtes pas autorisé à acceder à ce service.<br>
            ERREUR 2 - Le jeton applicatif est manquant.<br>
            ERREUR 3 - Le jeton applicatif est invalide.<br>
            ERREUR 4 - Votre application n'a plus le droit de se connecter à l'application. Merci de contacter le support de {app_name}
        '400':
          description: |
            ERREUR 5 - Données de création de collecte invalides. Format attendu: {'key': 'value'...}"<br>
            ERREUR 6 - Aucun GE signataire ne correpond.<br>
            ERREUR 7 - Aucun etat ne correspond.<br>
            ERREUR 8 - Aucune modalité ne correspond.<br>
            ERREUR 9 - Erreur à la création de la collecte: {err}<br>
            ERREUR 10 - La valeur de l'entrée {key} n'est pas comprise dans: 'True', 'False'.<br>
            ERREUR 11 - Les entrées suivantes sont obligatoires: "{mandatory_fields}<br>
            ERREUR 12 - Aucun document n'a été envoyé.<br>
            ERREUR 13 - Erreur à la création du document: {err}<br>
            ERREUR 14 - Erreur au téléchargement de document de la collecte {oge_id}<br>
            ERREUR 15 - Données de création des signataires invalides.
                Format attendu: "signatories":[{"first_name": "OBLIGATOIRE", "last_name": 'OBLIGATOIRE', "email": "OBLIGATOIRE", "mobile": "OBLIGATOIRE", "cadastral_references": "optionnel"}] ")<br>
            ERREUR 16 - Erreur à la création des signataires: {err}


