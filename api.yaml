           -Le dossier de rattachement du document à ajouter n'a pas été trouvé.

           -L'identifiant de la ressource dossier est incorrect.

           -Aucun cabinet associé au GE numéro ...

           -Votre compte utilisateur est attaché au cabinet ... et ne vous permet pas d'ajouter un document à ce dossier, car son cabinet detenteur est ...

           -La taille du document est trop grande. La taille limite est de 10 Mo.

           -Le document n'a pas été envoyé ou le form name indiqué n'est pas correct. Si la balise form_name n'est pas envoyée, le parametre contenant le document doit être nommée "file".

           -Le format du document envoyé n'est pas correct. Seuls les fichiers images, PDF, DXF ou DWG peuvent être transmis.

           -Le type de document ... n'est autorisé que pour les dossiers des départements 57, 67 ou 68.

           -Le fichier n'a pas pu être rattaché au dossier. Impossible de le référencer dans la base.
        '500':
