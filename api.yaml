  /signatures_v2/collections/{oge_id}/update_signatory:
    post:
      tags:
        - signature_v2
      description:  |
        Ce service permet de mettre à jour les informations d'un des signataires (email et mobile), sous réserve qu'il n'ait pas encore signé.
      summary: F8 - Mise à jour d'un signataire
      parameters:
        - name: oge_id
          in: path
          required: true
          description: Identifiant interne de la collecte
          schema:
            default: "fc5b96ad-7eff-443f-a48c-2efc710d5fd5"
            items:
              type: string
        - name: token_api
          in: query
          required: true
          description: Jeton applicatif valide
          schema:
            default: "166c5ffb-dc40-4bab-aaff-66a34ea70ca2"
            items:
              type: string
      requestBody:
        description: |
            Dans le body du POST, renseigner un objet __data__ avec :
            * une clé __index__ : le numéro d'ordre du signataire dans la collecte. Cette valeur peut être obtenue via le service *F3 - Détail d'une collecte* (l'index des signataires démarre à 1)
            * une clé __mobile__ : le numéro de téléphone mobile du signataire à mettre à jour
            * uen clé __email__ : l'adresse email du signataire à metttre à jour
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    index:
                      type: integer
                      description: index du signataire
                    email:
                      type: string
                      description: email du signataire
                    mobile:
                      type: string
                      description: mobile du signataire
      responses:
        '200':
          description: Signataire supprimé
        '404':
          description: Signataire non trouvé ou ayant déjà signé
          
