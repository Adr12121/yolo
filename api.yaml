  /rfuoge/edit:
    post:
      tags:
        - rfuoge
      description: |
        Ce service permet de créer, modifier ou supprimer des objets RFU.
        En réponse les logs des différentes opérations d’édition sont retournés, avec les éventuelles erreurs.

        Le contenu XML envoyé doit comporter les éléments suivants :
        - une balise englobante avec comme attribut le changeset utilisé pour les opérations demandées.
        Exemple : `<rfu changeset="16">...</rfu>`
        - une balise pour chaque sommet ou limite à ajouter, modifier ou supprimer.

        __Création d’un sommet__

        Le sommet à créer doit être envoyé sous forme d’un bloc XML avec les attributs suivants :
        - __id_noeud__ : facultatif mais utile car permet de simplifier la lecture des logs
        - __geometrie__ : la géométrie du sommet en lon/lat WGS84 au format WKT
        - __action="create"__ pour indiquer qu’il s’agit d’une création

        Les attributs du sommet doivent obligatoirement être fournis dans des balises enfants du bloc sommet.

        __Nouveauté v4__ : les champs som_ge_createur et lim_ge_createur ne sont plus nécessaires.
        Ces informations sont directement déduites des identifiants de connexion.

        Exemple :
        ```
        <sommet id_noeud="1" geometrie="POINT(-1.81341182 47.27198729)" action="create">
            <som_nature>Sommet lot AFAF</som_nature>
            <som_precision_rattachement>2</som_precision_rattachement>
            <som_coord_est>1336029.28</som_coord_est>
            <som_coord_nord>6241420.50</som_coord_nord>
            <som_representation_plane>RGF93CC47</som_representation_plane>
        </sommet>
        ```

        __Création d’une limite__

        La limite à créer doit être envoyée sous forme d’un bloc XML avec les attributs suivants :
        - __id_arc__ : facultatif mais utile car permet de simplifier la lecture des logs
        - __geometrie__ : la géométrie de la limite en lon/lat WGS84 au format WKT
        - __action="create"__ pour indiquer qu’il s’agit d’une création

        Exemple :
         ```
        <limite id_arc="151397" geometrie="LINESTRING(-1.81026694 47.27513939,-1.81039299 47.27493243)" action="create"/>
         ```

        __Modification attributaire d’un sommet__

        Il est possible de mettre à jour lea nature du sommet ou de verser de nouvelles coordonnées attributaires pour un sommet existant.

        La position géométrique d'un sommet n'est pas modifiable, même en cas de changement des coordonnées attributaires (som_coord_est et som_coord_nord)
        Le champ som_ge_createur sera automatiquement mis à jour lors de la modification du sommet avec l'identifiant du GE réalisant le versement. Le sommet à modifier doit être envoyé sous forme d’un bloc XML avec les attributs suivants :
        - __id_noeud__ : l’identifiant du nœud correspondant au sommet à modifier
        - __action="update"__ pour indiquer qu’il s’agit d’une mise à jour des attributs

        Comme pour la création, les attributs du sommet doivent obligatoirement être fournis (sauf som_date_creation et som_ge_createur) dans des balises enfants du bloc sommet.
        Exemple :
        ```
        <sommet id_noeud="1266593" version="1" action="update">
            <som_nature>Pierre</som_nature>
            <som_precision_rattachement>2</som_precision_rattachement>
            <som_coord_est>1331029.28</som_coord_est>
            <som_coord_nord>6241420.50</som_coord_nord>
            <som_representation_plane>RGF93CC47</som_representation_plane>
        </sommet>
        ```

        __Nouveauté v4__ : Dans le cas où les nouvelles coordonnées sont "hors tolérance", il est nécessaire d'ajouter au sommet une balise `<attestation_qualite>true</attestation_qualite>`.
        Cette balise atteste de la qualité du sommet versé, malgré l'écart, et permet que le versement soit accepté.

        Seule la modification de la nature du sommet entraine une nouvelle version du sommet. Si des nouvelles coordonnées sont versées sans modification de la nature du sommet, une nouvelle détermination est ajoutée au sommet sans que celui-ci soit directement modifié.

        __Suppression d’un sommet__

        Le sommet à supprimer doit être envoyé sous forme d’un bloc XML avec les attributs suivants :
        - __id_noeud__ : l’identifiant du nœud correspondant au sommet à supprimer
        - __action="delete"__ pour indiquer qu’il s’agit d’une suppression

        La géométrie et les attributs du sommet n’ont pas besoin d’être fournis.

        Exemple :
        `<sommet id_noeud="1" version="1" action="delete"></sommet>`

        __Attention__ : il n'est possible de supprimer que les sommets créés par certains géomètres-experts (cf C1).

        __Suppression d’une limite__

        La limite à supprimer doit être envoyée sous forme d’un bloc XML avec les attributs suivants :
        - __id_arc__ : l’identifiant de l’arc correspondant à l’arc à supprimer
        - __action="delete"__ pour indiquer qu’il s’agit d’une suppression

        La géométrie et les attributs de la limite n’ont pas besoin d’être fournis.
        Exemple :
        `<limite id_arc="1" version="1" action="delete"></limite>`

        Les créations, suppressions et modifications attributaire peuvent être envoyées dans une même requête. Cependant, les suppressions étant effectuées en premier, il n’est pas possible de supprimer un objet dont la demande de création serait dans la même requête XML.

