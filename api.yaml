      description:  |
        Ce service permet de créer un dossier sur Géofoncier.

        En réponse un nouveau dossier est créé, et son URI ainsi que son contenu sont affiché.

      summary: B7 - Création d'un dossier
      requestBody:
        description: Création d'un dossier
        required: true
        content:
          application/json:
            schema:
             $ref: '#/components/schemas/DossierCreation'

      responses:
        '201':
          description: Création
          content:
           application/json:
            schema:
                type: object
           application/xml:
            schema:
                type: object
        '401':
          description: |
           -Renseigner login et mot de passe Les identifiants n'ont pas été trouvé dans le header Authorization

           -Login ou mot de passe incorrect. Les identifiants fournis n'ont pas permis l'authentification.
        '400':
          description:  |
           -Les valeurs suivantes ne sont pas renseignées. Pour créer un dossier, certains paramètres sont obligatoires. Cette erreur signifie que des paramètres obligatoires n'ont pas été envoyés et indique lesquels.

           -La référence dossier contient un espace en début ou fin de chaine. La référence du dossier à créer ne doit contenir aucun espace en début ou en fin de chaîne.

           -La référence dossier ne doit pas comporter plus de 15 caractères.

           -La référence dossier contient une apostrophe. Ce caractère n'est pas autorisé pour une référence dossier.

           -Le cabinet créateur indiqué n'a pas de lien avec le cabinet détenteur. Les cabinets détenteur et créateur doivent être compatibles.

           -Aucun cabinet associé au GE numéro ...

           -Votre compte utilisateur ne vous permet pas de créer de dossier pour le cabinet spécifié ...

           -Le géomètre-expert indiqué n'a jamais exercé dans le cabinet créateur.

           -Le format de la date du dossier n'a pas été reconnu. La date du dossier doit être envoyée au format YYYY-MM-JJ ou JJ-MM-AAAA.

           -La date du dossier doit être antérieure ou égale à la date de versement dans Géofoncier.

           -La date du dossier doit être postérieure au 1er janvier 1900.

           -Le code opération n'existe pas. Le dossier ne peut pas être créé. Les codes opérations valides sont fournis par le service B3.

           -Le dossier existe déjà.

           -Echec lors de l'insertion du dossier. Une erreur s'est produite loes de l'insertion SQL du dossier. Le message d'erreur SQL est fourni dans la balise

        '403':
          description: Accès suspendu en attente du règlement de la redevance annuelle. La facturation de la redevance annuelle est sans règlement depuis plus de 90 jours.
