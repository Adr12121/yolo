openapi: "3.0.0"
info:
  version: 2.0.0
  title: Documentation API Géofoncier V2
  description: |
    Cette page décrit l'ensemble des services REST offerts par l'API Géofoncier.

    Pour la quasi-totalité des services présentés ci-dessous, une authentification en tant que géomètre-expert est requise.

    L'authentification s'effectue à l'aide d'un jeton (token) de type Bearer (bearerAuth). L'obtention de ce token se fait via un service dédié, décrit sur une autre page de cette documentation : <a href="/token.html" target="blank">obtenir un token</a>
    
    Cette documentation permet de tester directement les services dans l'environnement de préproduction (PREPROD). Pour cela, vous devez cliquer sur le bouton __Authorize__ situé au-dessus des services, puis renseigner un token valide correspondant au compte utilisé pour vos tests.

    Pour toute question ou besoin d'assistance, vous pouvez contacter le support technique Géofoncier à l'adresse suivante : <a href="mailto:support.technique@geofoncier.fr" target="blank">support.technique@geofoncier.fr</a>

  # contact:
  #   name:
  #   email:
  #   url:
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://api2.geofoncier.fr/api/
    description: Environnement prod
  - url: https://api2.preprod.geofoncier.fr/api/
    description: Environnement preprod

tags:
  - name: referentielsoge
    description: Composante REFERENTIEL
  - name: dossiersoge
    description: Composante DOSSIER
  - name: mes_dossiers
    description: Composante MES DOSSIERS
  - name: rfuoge
    description: Composante RFU
  - name: signature
    description: Composante SIGNATURE
  - name: signature_v2
    description: Composante SIGNATURE_V2
    # externalDocs:
    #   description: Find out more
    #   url: 'http://swagger.io'
paths:
  /referentielsoge/wxs/:
    get:
      tags:
        - referentielsoge
      description: |
        Ce service permet l’accès en visualisation et/ou interrogation aux données géographiques produites et maintenues par les géomètres-experts telles qu’elles sont visibles et/ou interrogeables sur le portail Géofoncier.

        Deux cas d’utilisation sont possibles :
        * __en mode non authentifié__ : accès en visualisation seulement aux données dans les même conditions que sur la version grand public du portail Géofoncier.
        * __en mode authentifié__ : accès en visualisation et interrogation aux données dans les mêmes conditions que sur la version professionnelle du portail Géofoncier.

        Les couches proposées sont :
        *  __Référentiel Foncier Unifié (RFU)__ : couches « limites » et « sommets »
        Le RFU est le résultat de l’assemblage au niveau national de l’ensemble des limites foncières issues des travaux fonciers des géomètres-experts réalisés à partir de juillet 2010.
        Couches mises à jour en temps réel en accès authentifié, mises à jour quotidiennes sinon.
        * __Localisants des dossiers géomètres-experts__ :
        Représentent l’ensemble des localisants des travaux réalisés par les géomètres-experts des géomètres-experts depuis 1997.
        Couches mises à jour en temps réel en accès authentifié, mises à jour quotidiennes sinon.
        * __Polygones d'emprise de dossiers des géomètres-experts__ :
        Représentent l’ensemble des polygones d'emprise des travaux réalisés par les géomètres-experts des géomètres-experts depuis 1997.
        Couches mises à jour en temps réel en accès authentifié, mises à jour quotidiennes sinon.
        * __Bureaux des géomètres-experts__ :
        Représentent l’ensemble des localisants des bureaux des géomètres-experts.
        Couche mise à jour quotidiennement.

        Les données sont visualisables, suivant le territoire, dans les projections suivantes :
        * __Tous les territoires__ : EPSG:4326 EPSG:900913
        * __Métropole__ : EPSG:2154 EPSG:3950 EPSG:3949 EPSG:3948 EPSG:3947 EPSG:3946 EPSG:3945 EPSG:3944 EPSG:3943 EPSG:3942 EPSG:3034 EPSG:3035 EPSG:3042 EPSG:3043 EPSG:3044
        * __Antilles__ : EPSG:4559
        * __Guyane__ : EPSG:2972
        * __Réunion__ : EPSG:2975
        * __Mayotte__ : EPSG:4471

        Les formats disponibles en sortie sont __png__ et __jpeg__.  
        __ATTENTION__ : l'url a été simplifiée depuis la v1, dans laquelle on avait /ogc/wxs, qui devient désormais /wxs
      summary: A1 - Flux OGC WMS
      security: []
      parameters:
        - name: SERVICE
          in: query
          description: WMS
          schema:
            items:
              type: string
        - name: REQUEST
          in: query
          description: getCapabilities/getMap
          schema:
            items:
              type: string
        - name: VERSION
          in: query
          description: 1.1.1 (ou 1.3.0, mais dans ce cas, utiliser CRS au lieu de SRS)
          schema:
            items:
              type: string
        - name: ENR_CAB_DETENTEUR
          in: query
          description: Facultatif. Fonctionne avec le paramètre TYPE_FILTRE. Lors du getMap, filtrage des dossiers affichés. Le numéro de cabinet indiqué ne peut être que celui du GE connecté.
          schema:
            items:
              type: string
        - name: TYPE_FILTRE
          in: query
          description: |
            Facultatif. Fonctionne avec le paramètre ENR_CAB_DETENTEUR.
            Lors du getMap, filtrage des dossiers affichés en prenant les valeurs suivantes :
            * __tous__ : affiche tous les dossiers visibles des autres GE et tous les dossiers du GE.
            * __hors_cabinet__ : affiche uniquement les dossiers visibles des autres GE.
            * __du_cabinet__ : affiche uniquement les dossiers du GE
          schema:
            items:
              type: string
        - name: BBOX
          in: query
          description: |
             Lors du getMap, extent demandée.
             Exemple : 1.8098667234259749,47.84895561004332,1.8527069658116162,47.858631489038096
          schema:
            items:
              type: string
        - name: SRS
          in: query
          description: |
             Lors du getMap, projection demandée.
             Exemple : EPSG:4326
          schema:
            items:
              type: string
        - name: WIDTH
          in: query
          description: |
             Lors du getMap, largeur de l'image demandée.
             Exemple : 1996
          schema:
            items:
              type: string
        - name: HEIGHT
          in: query
          description: |
             Lors du getMap, hauteur de l'image demandée.
             Exemple : 672
          schema:
            items:
              type: string
        - name: LAYERS
          in: query
          description: |
             Lors du getMap, layer(s) demandé(s).
             Exemple : metropole:aurige
          schema:
            items:
              type: string
        - name: FORMAT
          in: query
          description: |
             Lors du getMap, format de l'image demandé.
             Exemple : image/png
          schema:
            items:
              type: string
        - name: STYLES
          in: query
          description: |
             Lors du getMap, style spécifique.
             Exemple : default
          schema:
            items:
              type: string
      responses:
        '200':
          description: Résultat
        '500':
          description: |
            Erreur renvoyée par le serveur WMS
  /referentielsoge/bbox/:
    get:
      tags:
        - referentielsoge
      description: |
       Ce service permet d’obtenir d'obtenir les coordonnées de la boite englobante de plusieurs types d’entité manipulés par Géofoncier (adresse, point, référence parcellaire ou structure GE). Dans les 3 premiers cas, le service permet de faire une redirection automatique vers l'application Cartes centrée sur l'emprise trouvée.
      summary: A2 - Obtenir une emprise GéoFoncier
      security: []
      parameters:
        - name: point
          in: query
          description: Un point géographique. Nécessite d'indiquer une projection
          schema:
            items:
              type: string
        - name: projection
          in: query
          description: Pour le point géographique
          schema:
            items:
              type: string
        - name: structurege
          in: query
          description: |
            Une structure de géomètre(s)-expert(s) : le rectangle d’emprise prend en compte la position de tous les bureaux de la structure
          schema:
            items:
              type: string
        - name: insee
          in: query
          description: |
            Une commune : le code INSEE indiqué doit correspondre à une commune existant
          schema:
            items:
              type: string
        - name: prefixe
          in: query
          description: Un préfixe cadastral. Nécessite d'indiquer au minimum insee
          schema:
            items:
              type: string
        - name: section
          in: query
          description: Une section cadastrale. Nécessite d'indiquer au minimum insee.
          schema:
            items:
              type: string
        - name: numero
          in: query
          description: Une parcelle cadastrale. Nécessite d'indiquer au minimum insee et section.
          schema:
            items:
              type: string
        - name: adrvoie
          in: query
          description: La voie d'une adresse postale. A compléter avec le paramètre addrcomm
          schema:
            items:
              type: string
        - name: adrcomm
          in: query
          description: La commune d'une adresse postale
          schema:
            items:
              type: string
        - name: autoload
          in: query
          description: Paramètre facultatif qui permet d’obtenir une redirection sur un permalien Géofoncier permettant de visualiser la zone dans le portail https://expert.geofoncier.fr
          schema:
            items:
              type: string
      responses:
        '200':
          description: Résultat
        '400':
          description: |
            1. Aucun paramètre connu pour ce service n'a été fourni.

            2. La projection indiquée n'a pas été reconnue ou n'est pas autorisée.
            __Explication__ : les projections autorisées sont les suivantes.
            * `Pour la métropole` : 'EPSG:2154','EPSG:3950','EPSG:3949','EPSG:3948','EPSG:3947','EPSG:3946','EPSG:3945','EPSG:3944','EPSG:3943','EPSG:3942',
                    'IGNF:LAMB93','IGNF:RGF93CC50','IGNF:RGF93CC49','IGNF:RGF93CC48','IGNF:RGF93CC47','IGNF:RGF93CC46','IGNF:RGF93CC45','IGNF:RGF93CC44','IGNF:RGF93CC43','IGNF:RGF93CC42',
                    'EPSG:3034','EPSG:3035','EPSG:3042','EPSG:3043','EPSG:3044','IGNF:UTM31ETRS89','IGNF:UTM32ETRS89'
            * `Pour les Antilles` : 'EPSG:4559','IGNF:UTM20W84GUAD'
            * `Pour la Guyane` : 'EPSG:2972','IGNF:UTM22RGFG95'
            * `Pour la Réunion` : 'EPSG:2975','IGNF:RGR92UTM40S'
            * `Pour Mayotte` : 'EPSG:4471','IGNF:RGM04UTM38S'

            3. Les coordonnées indiquées pour le point ne sont pas au bon format (point=x,y

            4. Pour obtenir la bbox d'un point, il est nécessaire d'indiquer la projection des coordonnées de ce point.
            __Explication__ : le paramètre 'point' a été fourni sans le paramètre 'projection'

            5. La structure n'a pas été trouvée. __Explication__ : un parametre 'structurege' a été fourni mais la structure n'existe pas.

            6. La référence cadastrale n'a pas été trouvée.

            7. Le service de géocodage a retourné une erreur

  /referentielsoge/ge/:
    get:
      tags:
        - referentielsoge
      description: |
        Ce service permet de rechercher des géomètres-experts (personnes physiques) à partir de leur numéro, nom, prénom ou statut (actif).

        Le service retourne les GE trouvés :
        - dont le numéro est celui indiqué dans le paramètre __numero__,
        - dont le nom commence par celui indiqué dans le paramètre __nom__,
        - dont le prénom commence par celui indiqué dans le paramètre __prenom__,
        - dont le nom ou le prénom contient le texte indiqué dans le paramètre __libelle__,
        - et dont le statut est celui indiqué dans le paramètre __actif__

        Tous les paramètres sont optionnels. Si plusieurs filtres de recherche sont renseignés, ils se cumulent.

      summary: A3 - Identifier un géomètre-expert
      security: []
      parameters:
        - name: numero
          in: query
          description: Identifiant de géomètre-expert
          schema:
            items:
              type: string
        - name: nom
          in: query
          description: Nom du géomètre-expert (commence par...)
          schema:
            items:
              type: string
        - name: prenom
          in: query
          description: Prénom du géomètre-expert (commence par...)
          schema:
            items:
              type: string
        - name: libelle
          in: query
          description: Nom ou prénom du géomètre-expert (contient...)
          schema:
            items:
              type: string
        - name: actif
          in: query
          description: Identifiant de géomètre-expert
          schema:
            items:
              type: string
      responses:
        '200':
          description: Liste des géomètres-experts correspondant à la requête
          content:
           application/json:
            schema:
              $ref: '#/components/schemas/ReferentielGE'

        '500':
          description: |
            -Erreur du serveur

  /referentielsoge/structure/:
    get:
      tags:
        - referentielsoge
      description: |
        Ce service permet de rechercher des structures de géomètres-experts (personne morale) à partir de leur numéro ou de leur nom.

        Le service retourne les structures trouvées :
        - dont le numéro est celui indiqué dans le paramètre __numero__,
        - dont le nom contient le texte indiqué dans le paramètre __nom__,

        Il faut indiquer au moins un des 2 paramètres (nom ou numéro). Si les 2 sont renseignés, ils se cumulent.

      summary: A4 - Identifier une structure de géomètres-experts
      security: []
      parameters:
        - name: numero
          in: query
          description: Numéro de la structure
          schema:
            items:
              type: string
        - name: nom
          in: query
          description: Nom de la structure (contient...)
          schema:
            items:
              type: string

      responses:
        '200':
          description: Liste des structures correspondant à la requête
          content:
           application/json:
            schema:
              $ref: '#/components/schemas/StructureGE'

        '500':
          description: |
            -Erreur du serveur

  /referentielsoge/bureau/:
    get:
      tags:
        - referentielsoge
      description: |
        Ce service permet de rechercher des bureaux de géomètres-experts à partir du numéro ou nom de leur cabinet, ou de leur ville ou code postal.

        Le service retourne les bureaux trouvées :
        - dont le numéro de cabinet est celui indiqué dans le paramètre __numero__,
        - dont le nom de cabinet contient le texte indiqué dans le paramètre __nom__,
        - dont la ville commence par celui indiqué dans le paramètre __ville__,
        - dont le code postal est celui indiqué dans le paramètre __code_postal__

        Il faut indiquer au moins un des 4 paramètres (numéro ou nom de cabinet, ville ou code postal). Si plusieurs sont renseignés, ils se cumulent.

        Enfin, il est aussi possible de filtrer les résultats sur le type de bureau :
        * Bureau principal,
        * Bureau secondaire,
        * Permanence
        * Bureau de chantier.

      summary: A5 - Rechercher des bureaux de géomètres-experts
      security: []
      parameters:
        - name: numero
          in: query
          description: Numéro de la structure
          schema:
            items:
              type: string
        - name: nom
          in: query
          description: Nom de la structure (contient...)
          schema:
            items:
              type: string
        - name: ville
          in: query
          description: Nom de la ville (commence par...)
          schema:
            items:
              type: string
        - name: code_postal
          in: query
          description: Code postal de la ville
          schema:
            items:
              type: string
        - name: type_bureau
          in: query
          description: |
            Type de bureau parmi :
            Bureau principal, Bureau secondaire, Permanence, Bureau de chantier.
          schema:
            items:
              type: string

      responses:
        '200':
          description: Liste des bureaux correspondant à la requête
          content:
           application/json:
            schema:
              $ref: '#/components/schemas/BureauGE'

        '500':
          description: |
            -Erreur du serveur
  /referentielsoge/repreneur/:
    get:
      tags:
        - referentielsoge
      description: |
        Ce service permet d’obtenir le(s) cabinet(s) repreneur(s) d'un GE.
      summary: A6 - Repreneurs d'un GE
      security: []
      parameters:
        - name: numero
          in: query
          description: Numéro ordinal du géomètre-expert dont on cherche le repreneur
          schema:
            items:
              type: string

      responses:
        '200':
          description: Liste des cabinets repreneurs du GE
          content:
           application/json:
            schema:
              type: object
        '400':
          description: Vous devez indiquer au moins un numéro de GE correct
        '500':
          description: |
            -Erreur du serveur

  /referentielsoge/indicateurs/:
    get:
      tags:
        - referentielsoge
      description: |
        Ce service permet d’obtenir divers indicateurs sur l'état des bases Géofoncier.
      summary: A7 - Indicateurs sur les bases Géofoncier
      security: []
      responses:
        '200':
          description: Liste des indicateurs
          content:
           application/json:
            schema:
              type: object
        '500':
          description: |
            -Erreur du serveur

  /dossiersoge/detenteurcreateurge/:
    get:
      tags:
        - dossiersoge
      description: |
       Ce service permet d’obtenir la liste des triplets « enr_cab_detenteur », « enr_cab_createur » et « enr_ge_createur » disponibles pour un utilisateur.
      summary: B1 - Lister les cabinets pour un GE
      responses:
        '200':
          description: Résultat
          content:
           application/json:
            schema:
                type: string
           application/xml:
            schema:
                type: string
        '401':
          description: |
            -Renseigner login et mot de passe Les identifiants n'ont pas été trouvé dans le header Authorization

            -Login ou mot de passe incorrect. Les identifiants fournis n'ont pas permis l'authentification.
  /dossiersoge/codesinsee/:
    get:
      tags:
        - dossiersoge
      description:  |
         Ce service permet d’obtenir la liste des communes acceptées par Géofoncier sur un département.

         -Remarque 1 : Géofoncier n’accepte pas les codes INSEE des arrondissements municipaux (Paris, Lyon et Marseille) les codes INSEE communaux correspondant doivent leur être substitué (respectivement 75056, 69123 et 13055)

         -Remarque 2 : La liste des codes INSEE est mise à jour annuellement. Elle prend en compte les communes existantes ainsi que les communes ayant existées dans le passé (état de la balise « commune_actuelle »). Il est vivement conseillé d’utiliser en toute circonstance les codes INSEE de communes actives.


      summary: B2 - Lister les codes INSEE autorisés
      parameters:
        - name: dep
          in: query
          description: Code département. Deux ou trois chiffres (DOM)
          required: true
          schema:
            items:
              type: string
      responses:
        '200':
          description: Résultat
          content:
           application/json:
            schema:
                type: object
           application/xml:
            schema:
                type: object
        '401':
          description: |
            -Renseigner login et mot de passe Les identifiants n'ont pas été trouvé dans le header Authorization

            -Login ou mot de passe incorrect. Les identifiants fournis n'ont pas permis l'authentification.
        '400':
          description: |
            -Le département doit etre indiqué dans les paramètres avec 2 ou 3 caractères (ex : dep=31 ou dep=971)

            -Aucun code INSEE trouvé pour le département ...
  /dossiersoge/codesoperations/:
    get:
      tags:
        - dossiersoge
      description:  |
         Ce service permet d’obtenir la liste des codes opérations acceptés par Géofoncier.

         -Remarque : La liste des codes opération est identique sur tous les territoires

      summary: B3 - Lister les codes opérations autorisés

      responses:
        '200':
          description: Résultat
          content:
           application/json:
            schema:
                type: object
           application/xml:
            schema:
                type: object
        '401':
          description: |
            -Renseigner login et mot de passe Les identifiants n'ont pas été trouvé dans le header Authorization

            -Login ou mot de passe incorrect. Les identifiants fournis n'ont pas permis l'authentification.
        '400':
          description: Aucun code opération trouvé
  /dossiersoge/codesdocuments/:
    get:
      tags:
        - dossiersoge
      description:  |
         Ce service permet d’obtenir la liste des codes de type de document acceptés par Géofoncier..

         -Remarque :  La liste des codes de type de document est identique sur tous les territoires

      summary: B4 - Lister les codes documents autorisés
      responses:
        '200':
          description: Résultat
          content:
           application/json:
            schema:
                type: object
           application/xml:
            schema:
                type: object
        '401':
          description: |
            -Renseigner login et mot de passe Les identifiants n'ont pas été trouvé dans le header Authorization

            -Login ou mot de passe incorrect. Les identifiants fournis n'ont pas permis l'authentification.
        '400':
          description: Aucun code document trouvé
  /dossiersoge/nomenclaturedossiers/:
    get:
      tags:
        - dossiersoge
      description:  |
         Ce service permet d’obtenir la liste de nomenclature de document acceptés par Géofoncier.

      summary: B4a - Lister les nomenclature documents
      responses:
        '200':
          description: Résultat
          content:
           application/json:
            schema:
                type: object
           application/xml:
            schema:
                type: object
        '401':
          description: |
            -Renseigner login et mot de passe Les identifiants n'ont pas été trouvé dans le header Authorization

            -Login ou mot de passe incorrect. Les identifiants fournis n'ont pas permis l'authentification.
        '400':
          description: Aucun code document trouvé 
  /dossiersoge/formatsfichierautorises/:
    get:
      tags:
        - dossiersoge
      description:  |
        Ce service permet d’obtenir la liste des formats de fichier autorisés pour les documents dématérialisés acceptés par Géofoncier.

        Remarque : la liste des formats de fichier est identique sur tous les territoires

      summary: B4b - Lister les formats de fichier autorisés
      security: []
      responses:
        '200':
          description: Résultat
          content:
           application/json:
            schema:
                type: object
           application/xml:
            schema:
                type: object
        '400':
          description: Aucun format de fichier trouvé
  /dossiersoge/statuts/:
    get:
      tags:
        - dossiersoge
      description:  |
         Ce service permet d’obtenir la liste des statuts possibles pour un dossier dans Géofoncier. La liste des statuts est ordonnée.

      summary: B4c - Lister les statuts d'un dossier
      responses:
        '200':
          description: Résultat
          content:
           application/json:
            schema:
                type: object
           application/xml:
            schema:
                type: object
        '401':
          description: |
            -Renseigner login et mot de passe Les identifiants n'ont pas été trouvé dans le header Authorization

            -Login ou mot de passe incorrect. Les identifiants fournis n'ont pas permis l'authentification.
        '400':
          description: Aucun statut trouvé
  /dossiersoge/dossiers/:
    get:
      tags:
        - dossiersoge
      description:  |
         Ce service permet de rechercher les dossiers auxquels a accès l’utilisateur. Il permet notamment d’obtenir les URI des dossiers. Toute une série de filtres cumulatifs sont disponibles.

         -Les résultats retournés sont triés par ordre croissant des champs <enr_cab_createur> puis <enr_ref_dossier>.

         -Si le paramètre limit est utilisé dans la requeête afin de paginer les résultats.Les attributs de la balise racine permettront de connaitre
            - Le nombre total de résultatsc (count).
            - Le lien vers la page suivante des résultas si elle existe (next)
