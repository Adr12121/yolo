  /signatures_v2/collections/{oge_id}/remind_signatory:
    post:
      tags:
        - signature_v2
      description:  |
        Ce service permet d'envoyer un mail de rappel et un SMS à un des signataires, sous réserve qu'il n'ait pas encore signé.
      summary: F6 - Relance d'un signataire
      parameters:
        - name: oge_id
          in: path
          required: true
          description: Identifiant interne de la collecte
          schema:
            default: "fc5b96ad-7eff-443f-a48c-2efc710d5fd5"
            items:
              type: string
        - name: token_api
          in: query
          required: true
          description: Jeton applicatif valide
          schema:
            default: "166c5ffb-dc40-4bab-aaff-66a34ea70ca2"
            items:
              type: string
      requestBody:
        description: |
            Dans le body du POST, renseigner un objet __data__ avec une clé __index__ qui est le numéro d'ordre du signataire dans la collecte.  
            Cette valeur peut être obtenue via le service *F3 - Détail d'une collecte*.  
            __Attention__ : l'index du premier signataire est 1 (et non pas 0)
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    index:
                      type: integer
                      description: index du signataire
      responses:
        '200':
          description: Signataire relancé
        '404':
          description: Signataire non trouvé ou ayant déjà signé

