              * B : Brouillon
              * P : Prête à l\'envoi
              * 0 : En cours
              * 1 : Expirée
              * 2 : Terminée
              * 3 : Annulée par un signataire
              * 4 : Echec technique
              * 5 : Document d\'identité en attente de validation
              * A : Archivée
              * Z : Annulée en fin de collecte par le GE
              * R : Reprogrammée plus tard

        sign_order:
          type: string
          description: |
