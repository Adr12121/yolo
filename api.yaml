        __Changements V2 :__
          - Suppression de la durée totale de la collecte. Elle est de 90 jours.
          - Ajout de l'objet du mail l'initial (*convocation_email_object*).
          - Ajout de l'objet du mail de relance (*reminder_email_object*).
          - Restriction de l'objet d'un mail à 100 caractères.
          - Restriction du texte d'un mail à 1000 caractères.
          - Suppression du paramètres *__display_date_on_seal__*
          - Suppression du paramètres *__use_hand_signature__*
          - Suppression du paramètres *__get_sign_notifications__*
          - Suppression du paramètres *__sign_order__*
          - Ajout du paramètres *__ge_last_sign__*

      summary: F1 - Création d'une collecte
      parameters:
        - name: token_api
          in: query
          required: true
          description: Jeton applicatif valide
          schema:
            default: "166c5ffb-dc40-4bab-aaff-66a34ea70ca2"
            items:
              type: string
      requestBody:
        description: Informations pour la création de la collecte
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                # 'file' will be the field name in this multipart request
                file:
                  type: string
                  format: binary
                data:
                  type: object
                  example: |
                          {
                              "enr_ref_dossier":"A20039",
                              "enr_api_dossier":"541823ed714deb7febe0a9a4d9fc074c",
                              "reminders":25,
                              "signatories":[{
                                "first_name": "PrénomSignataire1",
                                "last_name": "NomSignataire1",
                                "email": "email_signataire1@yopmail.fr",
                                "mobile": "XXXXXXXXXX",
                                "cadastral_references": "D52"
                              },{
                                "first_name": "PrénomSignataire2",
                                "last_name": "NomSignataire2",
                                "email": "email_signataire2@yopmail.fr",
                                "mobile": "XXXXXXXXXX",
                                "cadastral_references": "D52"
                              }],
                              "convocation_email_content":"Suite à l'intervention du géomètres-expert concernant votre parcelle {{ cad }}.\n Merci de réaliser cette opération rapidement. ",
                              "convocation_email_object":"Demande signature ",
                              "reminder_email_content":"Mail de rappel.",
                              "reminder_email_object":"Signature de rappel.",
                              "automatic_notification":"True",
                              "send_doc_to_ge_upon_finished":"True",
                              "ge_last_sign":"True"
                          }
                  properties:
                    collecte:
                      $ref: '#/components/schemas/CollecteCreation'
      responses:
        '201':
          description: Collecte créée
        '403':
          description: |
            ERREUR 1 - Vous n'êtes pas autorisé à acceder à ce service.<br>
            ERREUR 2 - Le jeton applicatif est manquant.<br>
            ERREUR 3 - Le jeton applicatif est invalide.<br>
            ERREUR 4 - Votre application n'a plus le droit de se connecter à l'application. Merci de contacter le support de {app_name}
        '400':
          description: |
            ERREUR 5 - Données de création de collecte invalides. Format attendu: {'key': 'value'...}"<br>
            ERREUR 6 - Aucun GE signataire ne correpond.<br>
            ERREUR 7 - Aucun etat ne correspond.<br>
            ERREUR 8 - Aucune modalité ne correspond.<br>
            ERREUR 9 - Erreur à la création de la collecte: {err}<br>
            ERREUR 10 - La valeur de l'entrée {key} n'est pas comprise dans: 'True', 'False'.<br>
            ERREUR 11 - Les entrées suivantes sont obligatoires: "{mandatory_fields}<br>
            ERREUR 12 - Aucun document n'a été envoyé.<br>
            ERREUR 13 - Erreur à la création du document: {err}<br>
            ERREUR 14 - Erreur au téléchargement de document de la collecte {oge_id}<br>
            ERREUR 15 - Données de création des signataires invalides.
                Format attendu: "signatories":[{"first_name": "OBLIGATOIRE", "last_name": 'OBLIGATOIRE', "email": "OBLIGATOIRE", "mobile": "OBLIGATOIRE", "cadastral_references": "optionnel"}] ")<br>
            ERREUR 16 - Erreur à la création des signataires: {err}


