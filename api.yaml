  /rfuoge/extraction:
     get:
      tags:
        - rfuoge
      description:  |
       Ce service permet d’extraire le RFU sur une emprise géographique donnée.

       Cette emprise peut être exprimée sous forme du bbox (xmin, ymin, xmax, ymax) ou sous forme d'un polygone fermé (x1 y1, x2 y2, x3 y3, x4 y4, x1 y1).

       En réponse les objets RFU __intersectés__ par l’emprise géographique indiquée sont décrits selon la structure ci-dessous.

       La taille de l'emprise est limitée en fonction de votre clé (cf. C2)
      summary: C3 - Extraction du RFU
      parameters:
        - name: bbox
          in: query
          description: |
            Coordonnées géographiques de l'emprise à extraire dans le système géodésique du territoire.
            Ex : 5.1975,43.3328,5.1983,43.3335
            La saisie d'au moins un des 2 champs (bbox ou polygon) est obligatoire.
          schema:
            items:
              type: string
        - name: polygon
          in: query
          description: |
            Polygone de l'emprise à extraire dans le système géodésique du territoire.
            Ex : 55.36272 -21.26523, 55.36272 -21.26321, 55.36491 -21.26321, 55.36491 -21.26523, 55.36272 -21.26523
            La saisie d'au moins un des 2 champs (bbox ou polygon) est obligatoire.
          schema:
            items:
              type: string
        - name: User-Agent
          in: header
          description: Clé logiciel
          required: true
          example: 3Jgsv0abrjifisx680AKGw257zSTG4
          schema:
            items:
              type: string
      responses:
        '200':
          description: Liste d'objets RFU
          content:
            application/json:
              schema:
                  type: object
            application/xml:
              schema:
                  type: object
        '403':
          description: |
            __403-12__ - Serveur d'authentification inaccessible<br>
            __403-13__ - Login ou mot de passe incorrect<br>
            __403-14__ - Renseigner la clé logiciel dans le User-Agent de la requête.
              Explication : une clé logiciel est nécessaire pour ce service.
              Elle doit figurer dans le header User-Agent de la requête<br>
            __403-15__ - Clé logiciel incorrecte.
              Explication : une clé logiciel est nécessaire pour ce service.
              Elle doit figurer dans le header User-Agent de la requête. #ERROR<br>
            __403-19__ - Jeton invalide: erreur lors de son déchiffrage<br>
            __403-20__ - Jeton expiré.

